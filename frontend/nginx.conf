server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Vue router — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets — safe to cache forever, filename changes on content change
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Proxy GraphQL to backend
    location /graphql {
        proxy_pass http://helvetisublet-backend:8000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
