services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db_data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/helveti.db
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  db_data:

networks:
  app:
