services:
  helvetisublet-backend:
    build: ./backend
    container_name: helvetisublet-backend
    restart: unless-stopped
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/helveti.db
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  helvetisublet-frontend:
    build: ./frontend
    container_name: helvetisublet-frontend
    restart: unless-stopped
    depends_on:
      - helvetisublet-backend
    networks:
      - internal
      - proxy

volumes:
  db_data:

networks:
  internal:
  proxy:
    external: true
    name: proxy
